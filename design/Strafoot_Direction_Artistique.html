  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ctique<\u002Fspan>\n        <span style=\"font-size:14px; line-height:20px; color:#A1A1AB; text-wrap:pretty;\">Systèmes, triangles, animations collectives.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#18181C; border-radius:16px; overflow:hidden; display:flex; flex-direction:column;\">\n      <div style=\"height:150px; background:radial-gradient(90% 85% at 50% 0%, rgba(167,139,250,0.20), rgba(167,139,250,0) 70%); display:flex; align-items:center; justify-content:center;\">\n        <svg width=\"200\" height=\"130\" sc-camel-view-box=\"0 0 200 130\">\n          <path d=\"M20 114 H100\" style=\"fill:none; stroke:#3A3A44; stroke-width:2\"><\u002Fpath>\n          <circle cx=\"160\" cy=\"48\" r=\"17\" style=\"fill:none; stroke:#3A3A44; stroke-width:2\"><\u002Fcircle>\n          <circle cx=\"160\" cy=\"48\" r=\"5\" style=\"fill:#3A3A44\"><\u002Fcircle>\n          <path d=\"M58 92 Q96 6 142 41\" style=\"fill:none; stroke:#A78BFA; stroke-width:3; stroke-linecap:round\"><\u002Fpath>\n          <polygon points=\"150,47 137.7,44.6 144.3,35.8\" style=\"fill:#A78BFA\"><\u002Fpolygon>\n          <circle cx=\"48\" cy=\"100\" r=\"12\" style=\"fill:#F4F4F5\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px;\">\n        <span style=\"font-size:16px; font-weight:600;\">Technique<\u002Fspan>\n        <span style=\"font-size:14px; line-height:20px; color:#A1A1AB; text-wrap:pretty;\">Gestes, prises de balle, surfaces de contact.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#18181C; border-radius:16px; overflow:hidden; display:flex; flex-direction:column;\">\n      <div style=\"height:150px; background:radial-gradient(90% 85% at 50% 0%, rgba(167,139,250,0.20), rgba(167,139,250,0) 70%); display:flex; align-items:center; justify-content:center;\">\n        <svg width=\"200\" height=\"130\" sc-camel-view-box=\"0 0 200 130\">\n          <rect x=\"40\" y=\"34\" width=\"120\" height=\"62\" rx=\"10\" style=\"fill:#222228; stroke:#2E2E36; stroke-width:1.5\"><\u002Frect>\n          <text x=\"100\" y=\"66\" style=\"font: 700 36px 'Barlow Condensed', sans-serif; fill:#F4F4F5; text-anchor:middle; dominant-baseline:central\">3–3<\u002Ftext>\n          <text x=\"100\" y=\"114\" style=\"font: 600 16px 'Barlow Condensed', sans-serif; fill:#A1A1AB; text-anchor:middle; dominant-baseline:central\">2022<\u002Ftext>\n          <rect x=\"94\" y=\"16\" width=\"12\" height=\"12\" transform=\"rotate(45 100 22)\" style=\"fill:#A78BFA\"><\u002Frect>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px;\">\n        <span style=\"font-size:16px; font-weight:600;\">Culture<\u002Fspan>\n        <span style=\"font-size:14px; line-height:20px; color:#A1A1AB; text-wrap:pretty;\">Grands matchs, règles, histoire du jeu.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#18181C; border-radius:16px; overflow:hidden; display:flex; flex-direction:column;\">\n      <div style=\"height:150px; background:radial-gradient(90% 85% at 50% 0%, rgba(167,139,250,0.20), rgba(167,139,250,0) 70%); display:flex; align-items:center; justify-content:center;\">\n        <svg width=\"200\" height=\"130\" sc-camel-view-box=\"0 0 200 130\">\n          <circle cx=\"100\" cy=\"65\" r=\"44\" style=\"fill:none; stroke:#3A3A44; stroke-width:2\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"65\" r=\"28\" style=\"fill:none; stroke:#3A3A44; stroke-width:2\"><\u002Fcircle>\n          <path d=\"M100 21 A44 44 0 1 1 56 65\" style=\"fill:none; stroke:#A78BFA; stroke-width:3; stroke-linecap:round\"><\u002Fpath>\n          <circle cx=\"100\" cy=\"65\" r=\"10\" style=\"fill:#F4F4F5\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px;\">\n        <span style=\"font-size:16px; font-weight:600;\">Mental<\u002Fspan>\n        <span style=\"font-size:14px; line-height:20px; color:#A1A1AB; text-wrap:pretty;\">Concentration, pression, gestion du score.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:16px 24px; font-size:14px; line-height:20px; color:#A1A1AB; text-wrap:pretty;\">\n    <span><b style=\"color:#F4F4F5;\">Trait 2 à 3 px<\u002Fb>, extrémités rondes. Lignes de terrain en #3A3A44.<\u002Fspan>\n    <span><b style=\"color:#F4F4F5;\">Joueurs<\u002Fb> en disques blancs, adversaires en anneaux gris, comme dans les schémas.<\u002Fspan>\n    <span><b style=\"color:#F4F4F5;\">Un sujet violet<\u002Fb> par image. Aucun autre dégradé que la lueur.<\u002Fspan>\n    <span><b style=\"color:#F4F4F5;\">Fond surface<\u002Fb>, coins 16. L'illustration accompagne le thème, jamais une question.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:8px; max-width:720px; padding-top:24px;\">\n    <span style=\"font-size:20px; line-height:26px; font-weight:600;\">Schéma tactique vu du dessus<\u002Fspan>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#A1A1AB; text-wrap:pretty;\">On attaque toujours vers la droite. Terrain sombre, jamais vert : le contraste va aux joueurs et aux options, pas au gazon.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start;\">\n    <div style=\"max-width:100%; overflow-x:auto; border-radius:20px;\">\n      <div style=\"zoom:1.6; width:358px; height:232px;\">\n        <dc-import name=\"SchemaTactique\" hint-size=\"358px,232px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:min(100%, 300px); display:flex; flex-direction:column;\">\n      <div style=\"display:grid; grid-template-columns:84px minmax(0,1fr); gap:16px; align-items:center; padding:12px 0; border-top:1px solid #2E2E36;\">\n        <svg width=\"84\" height=\"36\" sc-camel-view-box=\"0 0 84 36\"><circle cx=\"20\" cy=\"18\" r=\"11\" style=\"fill:#F4F4F5\"><\u002Fcircle><text x=\"20\" y=\"19\" style=\"font: 700 12px -apple-system, system-ui, sans-serif; fill:#101013; text-anchor:middle; dominant-baseline:central\">6<\u002Ftext><\u002Fsvg>\n        <div style=\"display:flex; flex-direction:column;\"><span style=\"font-size:16px; font-weight:600;\">Nous<\u002Fspan><span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Disque plein blanc, numéro anthracite.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:84px minmax(0,1fr); gap:16px; align-items:center; padding:12px 0; border-top:1px solid #2E2E36;\">\n        <svg width=\"84\" height=\"36\" sc-camel-view-box=\"0 0 84 36\"><circle cx=\"20\" cy=\"18\" r=\"10\" style=\"fill:#18181C; stroke:#A1A1AB; stroke-width:2.5\"><\u002Fcircle><text x=\"20\" y=\"19\" style=\"font: 700 12px -apple-system, system-ui, sans-serif; fill:#A1A1AB; text-anchor:middle; dominant-baseline:central\">6<\u002Ftext><\u002Fsvg>\n        <div style=\"display:flex; flex-direction:column;\"><span style=\"font-size:16px; font-weight:600;\">Eux<\u002Fspan><span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Anneau gris 2,5 px : distinct sans la couleur.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:84px minmax(0,1fr); gap:16px; align-items:center; padding:12px 0; border-top:1px solid #2E2E36;\">\n        <svg width=\"84\" height=\"36\" sc-camel-view-box=\"0 0 84 36\"><circle cx=\"20\" cy=\"18\" r=\"16\" style=\"fill:none; stroke:#A78BFA; stroke-width:2.5\"><\u002Fcircle><circle cx=\"20\" cy=\"18\" r=\"11\" style=\"fill:#F4F4F5\"><\u002Fcircle><circle cx=\"44\" cy=\"26\" r=\"4.5\" style=\"fill:#F4F4F5; stroke:#101013; stroke-width:1.5\"><\u002Fcircle><\u002Fsvg>\n        <div style=\"display:flex; flex-direction:column;\"><span style=\"font-size:16px; font-weight:600;\">Toi et le ballon<\u002Fspan><span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Halo violet. Ballon blanc cerclé, collé au porteur.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:84px minmax(0,1fr); gap:16px; align-items:center; padding:12px 0; border-top:1px solid #2E2E36;\">\n        <svg width=\"84\" height=\"36\" sc-camel-view-box=\"0 0 84 36\"><line x1=\"4\" y1=\"18\" x2=\"66\" y2=\"18\" style=\"stroke:#A78BFA; stroke-width:2.5; stroke-dasharray:7 6; stroke-linecap:round\"><\u002Fline><polygon points=\"78,18 67,12 67,24\" style=\"fill:#A78BFA\"><\u002Fpolygon><circle cx=\"36\" cy=\"18\" r=\"11\" style=\"fill:#A78BFA; stroke:#18181C; stroke-width:2\"><\u002Fcircle><text x=\"36\" y=\"19\" style=\"font: 700 14px -apple-system, system-ui, sans-serif; fill:#101013; text-anchor:middle; dominant-baseline:central\">1<\u002Ftext><\u002Fsvg>\n        <div style=\"display:flex; flex-direction:column;\"><span style=\"font-size:16px; font-weight:600;\">Options 1 à 4<\u002Fspan><span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Pointillé : passe. Trait plein : conduite. Pastille 14 px gras, reprise dans les réponses.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:84px minmax(0,1fr); gap:16px; align-items:center; padding:12px 0; border-top:1px solid #2E2E36;\">\n        <svg width=\"84\" height=\"36\" sc-camel-view-box=\"0 0 84 36\"><line x1=\"4\" y1=\"8\" x2=\"13\" y2=\"8\" style=\"stroke:#F4F4F5; stroke-width:2; stroke-linecap:round\"><\u002Fline><polygon points=\"19,8 12,3.5 12,12.5\" style=\"fill:#F4F4F5\"><\u002Fpolygon><line x1=\"4\" y1=\"19\" x2=\"19\" y2=\"19\" style=\"stroke:#F4F4F5; stroke-width:2.5; stroke-linecap:round\"><\u002Fline><polygon points=\"25,19 18,14.5 18,23.5\" style=\"fill:#F4F4F5\"><\u002Fpolygon><line x1=\"4\" y1=\"30\" x2=\"26\" y2=\"30\" style=\"stroke:#F4F4F5; stroke-width:3.2; stroke-linecap:round\"><\u002Fline><polygon points=\"32,30 25,25.5 25,34.5\" style=\"fill:#F4F4F5\"><\u002Fpolygon><\u002Fsvg>\n        <div style=\"display:flex; flex-direction:column;\"><span style=\"font-size:16px; font-weight:600;\">Vitesse<\u002Fspan><span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Marche, course, sprint : 9, 15, 22 px et 2 à 3,2 px d'épaisseur.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:84px minmax(0,1fr); gap:16px; align-items:center; padding:12px 0; border-top:1px solid #2E2E36; border-bottom:1px solid #2E2E36;\">\n        <div style=\"display:flex; align-items:baseline; gap:6px; padding:2px 8px; border-radius:8px; background:#101013; box-shadow:inset 0 0 0 1px #2E2E36; font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:20px; line-height:28px; justify-self:start;\"><span>2–1<\u002Fspan><span style=\"color:#A1A1AB;\">78'<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\"><span style=\"font-size:16px; font-weight:600;\">Encart<\u002Fspan><span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Score et minute en haut à gauche, chiffres d'affichage.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:14px; line-height:20px; color:#A1A1AB; padding-top:12px; text-wrap:pretty;\">Exception assumée : numéros de maillot en 12 px gras, toujours repris en toutes lettres dans la question.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"ecrans\" data-screen-label=\"06 Écrans\" style=\"max-width:1280px; margin:0 auto; padding:72px clamp(20px, 4vw, 56px); border-top:1px solid #2E2E36; display:flex; flex-direction:column; gap:32px; box-sizing:border-box;\">\n  <div style=\"display:flex; flex-direction:column; gap:8px; max-width:720px;\">\n    <span style=\"font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:20px; color:#FF6A1A;\">06<\u002Fspan>\n    <h2 style=\"margin:0; font-size:44px; line-height:48px; font-weight:700; letter-spacing:-.01em;\">Écrans de référence<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#A1A1AB; text-wrap:pretty;\">iPhone, 390 px. Le quiz et le test sont interactifs : choisis une réponse puis « Valider », saisis tes temps.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:40px 36px;\">\n\n    <div style=\"display:flex; flex-direction:column; gap:20px; padding:11px;\">\n      <div style=\"display:flex; align-items:baseline; gap:10px;\"><span style=\"font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:20px; color:#FF6A1A;\">6.1<\u002Fspan><span style=\"font-size:16px; font-weight:600;\">Accueil<\u002Fspan><\u002Fdiv>\n      <div data-screen-label=\"Accueil\" style=\"width:390px; height:844px; border-radius:54px; background:#101013; box-shadow:0 0 0 10px #050506, 0 0 0 11px #2E2E36, 0 40px 80px rgba(0,0,0,0.5); overflow:hidden; position:relative; display:flex; flex-direction:column; flex-shrink:0;\">\n        <div style=\"height:54px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 44px; position:relative; z-index:1;\">\n          <span style=\"font-size:17px; font-weight:600;\">9:41<\u002Fspan>\n          <div style=\"position:absolute; left:50%; top:11px; margin-left:-62px; width:124px; height:36px; border-radius:20px; background:#000;\"><\u002Fdiv>\n          <div style=\"display:flex; gap:6px; align-items:center;\"><span style=\"display:inline-block; flex-shrink:0; width:1em; height:1em; background-color:currentColor; -webkit-mask:url(&quot;dbc8a9c3-9c45-400a-b883-3554c605d5a5&quot;) center / contain no-repeat; mask:url(&quot;dbc8a9c3-9c45-400a-b883-3554c605d5a5&quot;) center / contain no-repeat; font-size:17px;\"><\u002Fspan><span style=\"display:inline-block; flex-shrink:0; width:1em; height:1em; background-color:currentColor; -webkit-mask:url(&quot;3718b5c0-175b-4e52-b914-bdd7e615b2a tyle=\"width:16px; height:12px; background:#FF6A1A; border-radius:2px;\"><\u002Fspan>\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">xl<\u002Fspan><span>24<\u002Fspan><span style=\"width:24px; height:12px; background:#FF6A1A; border-radius:2px;\"><\u002Fspan>\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">xxl<\u002Fspan><span>32<\u002Fspan><span style=\"width:32px; height:12px; background:#FF6A1A; border-radius:2px;\"><\u002Fspan>\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">xxxl<\u002Fspan><span>48<\u002Fspan><span style=\"width:48px; height:12px; background:#FF6A1A; border-radius:2px;\"><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">Marge d'écran 16, entre cartes 12, dans une carte 16.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:16px;\">\n      <div style=\"background:#18181C; border-radius:20px; padding:20px 24px; display:flex; flex-direction:column; gap:12px;\">\n        <span style=\"font-size:20px; line-height:26px; font-weight:600;\">Rayons<\u002Fspan>\n        <div style=\"display:flex; flex-wrap:wrap; gap:16px;\">\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px;\"><div style=\"width:48px; height:48px; border-radius:8px; background:#222228; box-shadow:inset 0 0 0 1.5px #3A3A44;\"><\u002Fdiv><span style=\"font-size:14px;\">sm 8<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px;\"><div style=\"width:48px; height:48px; border-radius:12px; background:#222228; box-shadow:inset 0 0 0 1.5px #3A3A44;\"><\u002Fdiv><span style=\"font-size:14px;\">md 12<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px;\"><div style=\"width:48px; height:48px; border-radius:16px; background:#222228; box-shadow:inset 0 0 0 1.5px #3A3A44;\"><\u002Fdiv><span style=\"font-size:14px;\">lg 16<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px;\"><div style=\"width:48px; height:48px; border-radius:20px; background:#222228; box-shadow:inset 0 0 0 1.5px #3A3A44;\"><\u002Fdiv><span style=\"font-size:14px;\">xl 20<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:6px;\"><div style=\"width:48px; height:48px; border-radius:999px; background:#222228; box-shadow:inset 0 0 0 1.5px #3A3A44;\"><\u002Fdiv><span style=\"font-size:14px;\">pill<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:14px; line-height:20px; color:#A1A1AB;\">sm : encarts · md : boutons, champs · lg : cartes · xl : feuilles · pill : puces.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#18181C; border-radius:20px; padding:20px 24px; display:flex; flex-direction:column; gap:8px;\">\n        <span style=\"font-size:20px; line-height:26px; font-weight:600;\">Cibles et mouvement<\u002Fspan>\n        <div style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; font-size:14px; line-height:20px;\">\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">touch.min<\u002Fspan><span>48<\u002Fspan>\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">touch.button<\u002Fspan><span>56<\u002Fspan>\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">motion.press / micro / base<\u002Fspan><span>100 / 160 / 240<\u002Fspan>\n          <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace;\">motion.screen / count<\u002Fspan><span>320 / 600<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#18181C; border-radius:20px; overflow:hidden;\">\n    <div style=\"display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 8px 8px 20px; border-bottom:1px solid #2E2E36;\">\n      <span style=\"font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:14px; color:#A1A1AB;\">theme.ts<\u002Fspan>\n      <button sc-camel-on-click=\"{{ copy }}\" style=\"height:48px; padding:0 20px; border:0; border-radius:12px; background:#222228; box-shadow:inset 0 0 0 1px #2E2E36; color:#F4F4F5; font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; transition:transform 100ms, background-color 100ms;\" style-active=\"background:#2A2A31; transform:scale(0.98)\">{{ copyLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <pre style=\"margin:0; padding:20px; overflow-x:auto; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:14px; line-height:22px; color:#F4F4F5; white-space:pre;\">{{ tokensCode }}<\u002Fpre>\n  <\u002Fdiv>\n<\u002Fsection>\n<sc-if value=\"{{ sunOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; pointer-events:none; z-index:9999; background:rgba(255,250,240,0.34);\"><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ grayOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; pointer-events:none; z-index:9999; backdrop-filter:grayscale(1); -webkit-backdrop-filter:grayscale(1);\"><\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;simulation&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Aucune&quot;,&quot;Plein soleil&quot;,&quot;Niveaux de gris&quot;],&quot;default&quot;:&quot;Aucune&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lisibilité&quot;},&quot;resultatQuiz&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Meilleur choix&quot;,&quot;Défendable&quot;,&quot;Faible&quot;,&quot;Erreur&quot;],&quot;default&quot;:&quot;Défendable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Écran quiz&quot;}}\">\nclass Component extends DCLogic {\n  state = { sel: 3, chosen: null, others: false, more: false, trials: ['4,52', '4,47', ''], copied: false };\n\n  componentDidUpdate(pp) {\n    if (pp.resultatQuiz !== this.props.resultatQuiz) this.setState({ chosen: null, others: false, more: false });\n  }\n\n  renderVals() {\n    const s = this.state, p = this.props;\n    const R = {\n      good: { label: 'Meilleur choix', glyph: '✓✓', elo: 12, bg: '#3DD68C', fg: '#101013', ring: '#3DD68C', tone: '#3DD68C' },\n      def: { label: 'Défendable', glyph: '✓', elo: 4, bg: '#A1A1AB', fg: '#101013', ring: '#A1A1AB', tone: '#A1A1AB' },\n      weak: { label: 'Faible', glyph: '?', elo: -6, bg: '#101013', fg: '#F05A5C', ring: '#F05A5C', tone: '#F05A5C' },\n      err: { label: 'Erreur', glyph: '✗', elo: -11, bg: '#C23A3D', fg: '#FFFFFF', ring: '#C23A3D', tone: '#F05A5C' },\n    };\n    const A = [\n      { n: 1, text: 'Remise en une touche au 6', r: 'good' },\n      { n: 2, text: 'Pivot et jeu long vers le 9', r: 'weak' },\n      { n: 3, text: 'Protéger et attendre le latéral', r: 'def' },\n      { n: 4, text: \"Dribble vers l'intérieur\", r: 'err' },\n    ];\n    const C = {\n      good: ['Remise en une touche : tu fixes leur 6 et tu gardes le ballon.', \"À 2–1 et à la 78e, conserver prime. Dos au jeu et pressé, l'appui libre derrière toi efface la pression sans risque.\"],\n      def: ['Protéger tient, mais tu offres une seconde au pressing.', 'Ton latéral arrive, mais leur 3 suit sa course. La remise immédiate au 6 était plus sûre : elle fixe leur 6 et ouvre le côté faible.'],\n      weak: [\"Pivoter dos au jeu sous pression, c'est perdre le ballon une fois sur deux.\", 'Ton 9 est pris par leur 5. Devant au score à la 78e, la remise au 6 gardait le contrôle.'],\n      err: [\"Rentrer à l'intérieur, c'est aller droit dans leur 6.\", \"Une perte dans l'axe à 2–1, c'est une contre-attaque. Ici, la remise au 6 en une touche était la solution.\"],\n    };\n    const MAP = { 'Meilleur choix': 1, 'Défendable': 3, 'Faible': 2, 'Erreur': 4 };\n    const chosenN = s.chosen ?? MAP[p.resultatQuiz] ?? 3;\n    const fmt = n => n.toLocaleString('fr-FR');\n    const decorate = a => { const r = R[a.r]; return { ...a, ...r, eloText: (r.elo > 0 ? '+' : '−') + Math.abs(r.elo) }; };\n    const ch = decorate(A[chosenN - 1]);\n    const up = ch.elo > 0;\n\n    const answersQ = A.map(a => {\n      const on = a.n === s.sel;\n      return {\n        ...a,\n        onPick: () => this.setState({ sel: a.n }),\n        rowBg: on ? 'rgba(167,139,250,0.14)' : '#18181C',\n        rowBd: on ? '#A78BFA' : '#2E2E36',\n        badgeBg: on ? '#A78BFA' : 'transparent',\n        badgeFg: on ? '#101013' : '#A78BFA',\n      };\n    });\n\n    const val = v => { const x = parseFloat(String(v).replace(',', '.')); return x >= 3 && x <= 9 ? x : null; };\n    const nums = s.trials.map(val);\n    const valid = nums.filter(x => x !== null);\n    const best = valid.length ? Math.min(...valid) : null;\n    const bi = best === null ? -1 : nums.indexOf(best);\n    const REC = 4.61;\n    const f2 = x => x.toFixed(2).replace('.', ',');\n    const trials = s.trials.map((v, i) => ({\n      label: 'Essai ' + (i + 1), value: v, ok: nums[i] !== null, ko: nums[i] === null, best: i === bi,\n      onChange: e => {\n        const t = [...this.state.trials];\n        t[i] = e.target.value.replace(/[^0-9,.]/g, '').slice(0, 5);\n        this.setState({ trials: t });\n      },\n    }));\n    let bestDelta = 'Saisis au moins un essai';\n    if (best !== null) {\n      const d = Math.round((best - REC) * 100) / 100;\n      bestDelta = d < 0 ? '▼ ' + f2(-d) + ' s · nouveau record' : d === 0 ? 'Égale ton record' : 'À ' + f2(d) + ' s de ton record';\n    }\n\n    const sim = p.simulation ?? 'Aucune';\n\n    return {\n      answersQ,\n      quizSel: s.sel,\n      validate: () => this.setState({ chosen: s.sel, others: false, more: false }),\n      eloBefore: fmt(1482),\n      eloAfter: fmt(1482 + ch.elo),\n      deltaText: (up ? '▲ ' : '▼ ') + Math.abs(ch.elo),\n      deltaFg: up ? '#3DD68C' : '#F05A5C',\n      deltaBg: up ? 'rgba(61,214,140,0.14)' : 'rgba(240,90,92,0.14)',\n      ch,\n      chosenN,\n      coachBold: C[ch.r][0],\n      coachMore: C[ch.r][1],\n      coachOpen: s.more,\n      coachLabel: s.more ? 'Moins' : 'Plus',\n      toggleCoach: () => this.setState(st => ({ more: !st.more })),\n      others: A.filter(a => a.n !== chosenN).map(decorate),\n      othersOpen: s.others,\n      othersIcon: s.others ? 'chevron-up' : 'chevron-down',\n      othersClosed: !s.others,\n      toggleOthers: () => this.setState(st => ({ others: !st.others })),\n      trials,\n      doneCount: valid.length + '/3',\n      bestText: best === null ? '—' : f2(best),\n      bestDelta,\n      bestDeltaColor: best !== null && best < REC ? '#3DD68C' : '#A1A1AB',\n      tokensCode: this.code,\n      copyLabel: s.copied ? 'Copié' : 'Copier',\n      copy: () => {\n        try { navigator.clipboard.writeText(this.code); } catch (e) {}\n        this.setState({ copied: true });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ copied: false }), 1600);\n      },\n      sunOn: sim === 'Plein soleil',\n      grayOn: sim === 'Niveaux de gris',\n      simLabel: sim,\n    };\n  }\n\n  code = `// theme.ts — Strafoot v1 (thème sombre uniquement)\nexport const color = {\n  bg: '#101013',              // fond de tous les écrans\n  surface: '#18181C',         // cartes, onglets, schémas\n  surface2: '#222228',        // champs, bouton secondaire, bulle coach\n  surfacePressed: '#2A2A31',  // surfaces pressées\n  border: '#2E2E36',          // décoratif uniquement\n  text: '#F4F4F5',            // 17,3:1 sur bg\n  textSecondary: '#A1A1AB',   // 7,4:1 sur bg\n  onAccent: '#101013',        // texte sur orange, violet, vert\n  accent: '#FF6A1A',          // action principale, série entraînement\n  accentPressed: '#E0580F',\n  accentTint: 'rgba(255,106,26,0.14)',\n  quiz: '#A78BFA',            // tout ce qui touche au quiz\n  quizPressed: '#8F72F0',\n  quizTint: 'rgba(167,139,250,0.14)',\n  success: '#3DD68C',         // progression, meilleur choix\n  danger: '#F05A5C',          // alertes, erreurs, régressions\n  error: '#C23A3D',           // pastille Erreur, glyphe blanc\n  pitchLine: '#3A3A44',       // lignes des schémas\n} as const;\n\nexport const quizGradient = {\n  colors: ['#FF6A1A', '#A78BFA'],\n  angle: 135,\n};\nexport const quizGlow = 'rgba(167,139,250,0.22)';\n\nexport const font = {\n  text: 'System',                    // SF Pro / Roboto\n  display: 'BarlowCondensed-SemiBold',  // chiffres 28 à 44\n  displayBold: 'BarlowCondensed-Bold',  // chiffre héros 72\n};\n\nexport const type = {\n  caption:  { size: 14, lineHeight: 20, weight: '400' },\n  label:    { size: 14, lineHeight: 20, weight: '600', letterSpacing: 0.84, upper: true },\n  body:     { size: 16, lineHeight: 24, weight: '400' },\n  button:   { size: 16, lineHeight: 20, weight: '700' },\n  title:    { size: 20, lineHeight: 26, weight: '600' },\n  headline: { size: 28, lineHeight: 32, weight: '700' },\n  number:   { size: 44, lineHeight: 44, weight: '600', family: 'display' },\n  hero:     { size: 72, lineHeight: 68, weight: '700', family: 'display' },\n};\n\nexport const space = { xs: 4, sm: 8, md: 12, lg: 16, xl: 24, xxl: 32, xxxl: 48 };\nexport const radius = { sm: 8, md: 12, lg: 16, xl: 20, pill: 999 };\nexport const touch = { min: 48, button: 56 };\nexport const motion = {\n  press: 100, micro: 160, base: 240, screen: 320, count: 600,\n  easing: [0.2, 0, 0, 1],\n  pressScale: 0.98,\n};\n`;\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
