<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
      HTML racine du web : gabarit de l'export (expo.web.output « single »), qui y
      remplace le titre par expo.name et ajoute le favicon, le CSS et les scripts.
      Fond : colors.bg de lib/theme.ts, recopiée ici et dans manifest.webmanifest.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Strafoot" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* react-native-web : pleine hauteur, défilement dans les ScrollView seulement. */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Fond de l'app dès la première image et derrière un rebond : jamais de blanc. */
      html,
      body {
        background-color: #0B0B0D;
        overscroll-behavior: none;
      }
      /*
        App installée sur l'écran d'accueil (iOS, barre d'état black-translucent) : la
        page est dessinée dès le haut de l'écran, mais 100 % s'arrête une barre d'état
        trop tôt, d'où une bande vide en bas. 100lvh vaut tout l'écran ; le min() ne le
        dépasse jamais et retombe sur 100 % quand l'inset haut est nul (barre opaque,
        ordinateur, Android). body et #root suivent html à 100 %.
      */
      @media (display-mode: standalone) {
        html {
          height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px)));
        }
      }
    </style>
  </head>
  <body>
    <noscript>Strafoot a besoin de JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
